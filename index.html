<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>한화금융 콘텐츠 마케팅 - 김수영</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #0e0f12;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      width: 100%;
      max-width: 1200px;
    }
    .canva-wrapper {
      position: relative;
      width: 100%;
      height: 0;
      padding-top: 56.25%;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      border-radius: 12px;
      overflow: hidden;
      background: #000;
    }
    .canva-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="canva-wrapper">
      <iframe 
        loading="lazy" 
        src="https://www.canva.com/design/DAHWSR0rNiM/ucAQBoKNJiv_bDjqJA2GRg/view?embed" 
        allowfullscreen="allowfullscreen" 
        allow="fullscreen">
      </iframe>
    </div>
  </div>
</body>
</html>
